<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudyMate AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dark / Light Mode -->
  <button id="theme-toggle-btn">Toggle Dark / Light Mode</button>

  <!-- Page Heading -->
  <h1>StudyMate AI</h1>
  <p>Your personal AI study assistant.</p>

  <!-- Notes Input Section -->
  <h2>Enter Your Notes</h2>
  <textarea id="notes-input" rows="8" cols="60" placeholder="Enter your notes or topic here..."></textarea>
  <br>
  <button id="generate-btn">Generate Study Material</button>

  <!-- API Settings Section -->
  <h2>Settings</h2>
  <label for="api-key-input">Enter API Key:</label>
  <input type="password" id="api-key-input" placeholder="Enter your API key">
  <button id="save-key-btn">Save API Key</button>

  <!-- Loading Section -->
  <p id="loading-message">Generating study material...</p>

  <!-- Output Section -->
  <h2>Study Material</h2>

  <!-- Summary Section -->
  <h3>Summary</h3>
  <div id="summary-output"></div>
  <button id="copy-summary-btn">Copy Summary</button>
  <button id="download-summary-btn">Download Summary</button>

  <!-- Quiz Section -->
  <h3>Quiz</h3>
  <div id="quiz-output"></div>
  <button id="submit-quiz-btn">Submit Quiz</button>
  <p id="quiz-score"></p>

  <!-- Flashcards Section -->
  <h3>Flashcards</h3>
  <div id="flashcards-output"></div>

  <!-- History Section -->
  <h2>History</h2>
  <div id="history-output"></div>
  <button id="clear-history-btn">Clear History</button>

  <!-- Script Connection -->
  <script src="script.js"></script>

</body>
</html>
