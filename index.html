<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudyMate AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dark / Light Mode -->
  <button>Toggle Dark / Light Mode</button>

  <!-- Page Heading -->
  <h1>StudyMate AI</h1>
  <p>Your personal AI study assistant.</p>

  <!-- Notes Input Section -->
  <h2>Enter Your Notes</h2>
  <textarea rows="8" cols="60" placeholder="Enter your notes or topic here..."></textarea>
  <br>
  <button>Generate Study Material</button>

  <!-- API Settings Section -->
  <h2>Settings</h2>
  <label>Enter API Key:</label>
  <input type="password" placeholder="Enter your API key">
  <button>Save API Key</button>

  <!-- Loading Section -->
  <p>Generating study material...</p>

  <!-- Output Section -->
  <h2>Study Material</h2>

  <!-- Summary Section -->
  <h3>Summary</h3>
  <div></div>
  <button>Copy Summary</button>
  <button>Download Summary</button>

  <!-- Quiz Section -->
  <h3>Quiz</h3>
  <div></div>
  <button>Submit Quiz</button>
  <p></p>

  <!-- Flashcards Section -->
  <h3>Flashcards</h3>
  <div></div>

  <!-- History Section -->
  <h2>History</h2>
  <div></div>
  <button>Clear History</button>

  <!-- Script Connection -->
  <script src="script.js"></script>

</body>
</html>
